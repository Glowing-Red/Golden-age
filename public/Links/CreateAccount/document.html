<!-- template.html -->
<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Page</title>
</head>

<body>
    <h1>Account Registration Confirmation</h1>

    <div id="main-container">
        <h1 id="a">Welcome, {{USERNAME}}</h1>
        <p id="b">Your custom message: {{MESSAGE}}</p>
        <p id="c">what</p>

        <div>
            <label id="static-name">
                Username: ...
            </label>
            <label id="editable-name" style="display: none;">
                Username: <input type="text" value="..." />
                <button type="button" onclick="LockInName()">Lock In</button>
            </label>
        </div>

        <label id="static-email">
            Email: ...
        </label>

        <button type="button" onclick="CreateAccount()">Create Account</button>
        <button type="button" onclick="">Cancel Account Creation</button>
    </div>

    <div id="error-container" style="display: none;">
        <p id="error-message">Error Message...</p>
    </div>

    <script src="/Links/CreateAccount/script.js"></script>
</body>

</html>
